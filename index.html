<script>// LUMA address layer. The ledger itself uses standard XRPL account IDs (20 bytes). LUMA wallet addresses are the
// same 20 bytes encoded with version byte 48, which always yields a 34-char address starting with "L".
// The panel translates L <-> r at its edge, so rippled and standard XRPL tooling keep working unchanged.
'use strict';
const ALPHABET = 'rpshnaf39wBUDNEGHJKLM4PQRST7VWXYZ2bcdeCg65jkm8oFqi1tuvAxyz';
const L_VERSION = 48, T_VERSION = 65, R_VERSION = 0;
// Two LUMA networks, two address families over the same 20-byte account IDs: Mainnet "L…" (version 48), Testnet "T…" (version 65).
// A Testnet address can never pass as a Mainnet one (different checksum payload), so funds cannot be sent to the wrong network by typo or paste.
const VERS = { L: L_VERSION, T: T_VERSION }; let ACTIVE = 'L';
function use(prefix) { if (!VERS[prefix]) throw new Error('unknown address prefix'); ACTIVE = prefix; }
const active = () => ACTIVE;

// pure-JS SHA-256 (no dependencies)
const primes = []; for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
const frac = x => Math.floor((x % 1) * 4294967296);
const K = primes.map(p => frac(Math.cbrt(p))), H0 = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
const rotr = (x, n) => (x >>> n) | (x << (32 - n));
function sha256(bytes) {
  const l = bytes.length, pl = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(pl);
  m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(pl - 8, Math.floor(l * 8 / 4294967296)); dv.setUint32(pl - 4, (l * 8) >>> 0);
  const h = H0.slice(), w = new Array(64);
  for (let o = 0; o < pl; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rotr(b, 17) ^ rotr(b, 19) ^ (b >>> 10))) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer);
  h.forEach((v, i) => ov.setUint32(i * 4, v >>> 0)); return out;
}

function b58encode(bytes) {
  let n = 0n; for (const b of bytes) n = (n << 8n) | BigInt(b);
  let s = ''; while (n > 0n) { s = ALPHABET[Number(n % 58n)] + s; n /= 58n; }
  for (const b of bytes) { if (b === 0) s = ALPHABET[0] + s; else break; }
  return s;
}
function b58decode(str) {
  let n = 0n;
  for (const ch of str) { const i = ALPHABET.indexOf(ch); if (i < 0) throw new Error('invalid character in address'); n = n * 58n + BigInt(i); }
  const hex = n.toString(16); const body = hex === '0' ? [] : hex.padStart(hex.length + (hex.length % 2), '0').match(/../g).map(h => parseInt(h, 16));
  let lead = 0; for (const ch of str) { if (ch === ALPHABET[0]) lead++; else break; }
  return Uint8Array.from([...new Array(lead).fill(0), ...body]);
}
function encodeAccount(id, version) {
  const payload = Uint8Array.from([version, ...id]);
  const chk = sha256(sha256(payload)).slice(0, 4);
  return b58encode(Uint8Array.from([...payload, ...chk]));
}
function decodeAccount(addr) {
  const raw = b58decode(String(addr));
  if (raw.length !== 25) throw new Error('invalid address length');
  const payload = raw.slice(0, 21), chk = sha256(sha256(payload)).slice(0, 4);
  for (let i = 0; i < 4; i++) if (chk[i] !== raw[21 + i]) throw new Error('invalid address checksum');
  return { version: payload[0], id: payload.slice(1) };
}
const R_RE = /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/, LT_RE = /^[LT][1-9A-HJ-NP-Za-km-z]{33}$/;
// 'r' | 'L' | 'T' | null for a well-formed, checksum-valid address
function kind(a) { try { a = String(a); const v = decodeAccount(a).version; if (v === R_VERSION && R_RE.test(a)) return 'r'; if (LT_RE.test(a)) return v === L_VERSION ? 'L' : v === T_VERSION ? 'T' : null; return null; } catch { return null; } }
const NETNAME = { L: 'LUMA Mainnet (L…)', T: 'LUMA Testnet (T…)' };
function isL(a) { return kind(a) === ACTIVE; }          // "is a LUMA address of the ACTIVE network"
function wrongNet(a) { const k = kind(a); return (k === 'L' || k === 'T') && k !== ACTIVE ? `That is a ${NETNAME[k]} address, but this is ${NETNAME[ACTIVE]}. Funds sent to it would not arrive.` : ''; }
function isR(a) { try { return R_RE.test(a) && decodeAccount(a).version === R_VERSION; } catch { return false; } }
function toL(a) { if (isL(a)) return a; if (!isR(a)) throw new Error('not a valid address'); return encodeAccount(decodeAccount(a).id, VERS[ACTIVE]); }
function toR(a) { if (isR(a)) return a; const w = wrongNet(a); if (w) throw new Error(w); if (!isL(a)) throw new Error('not a valid address'); return encodeAccount(decodeAccount(a).id, R_VERSION); }
// accepts an L or r address, returns the r form the ledger uses; throws a clear error otherwise
function normalize(a) {
  a = String(a || '').trim();
  if (isL(a) || isR(a)) return toR(a);
  const w = wrongNet(a); if (w) throw new Error(w);
  throw new Error(a ? `invalid address (expected a ${ACTIVE}… ${NETNAME[ACTIVE]} address; bad character or checksum)` : 'address required');
}
// convert every r-address string inside a JSON value to its L form (hashes/hex never match)
function deepToL(v) {
  if (typeof v === 'string') return R_RE.test(v) && isR(v) ? toL(v) : v;
  if (Array.isArray(v)) return v.map(deepToL);
  if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) o[k] = deepToL(v[k]); return o; }
  return v;
}
const api = { sha256, encodeAccount, decodeAccount, isL, isR, toL, toR, normalize, deepToL, L_VERSION, T_VERSION, use, active, kind, wrongNet, NETNAME };
if (typeof module === 'object') module.exports = api; else globalThis.LumaAddr = api;
</script>

'use strict';
const XM=(()=>{
const pct=(a,p)=>{const s=a.filter(v=>v!=null&&!isNaN(v)).slice().sort((x,y)=>x-y);if(!s.length)return null;const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
/* 1. network pressure: how full recent ledgers are compared with the busiest seen, plus the node load factor */
function pressure(led,load){const t=led.slice(-30).map(l=>l.txs);if(t.length<3)return{level:'unknown',score:null,avg:null};const avg=t.reduce((a,b)=>a+b,0)/t.length,mx=Math.max(...led.map(l=>l.txs),1),score=Math.min(100,Math.round(Math.max(avg/mx*60,(load>1?Math.min(40,(load-1)*10):0)+avg/mx*40)));return{level:score>=75?'heavy':score>=40?'moderate':'light',score,avg:+avg.toFixed(1)}}
/* 2. close-time statistics */
function closeStats(led){const g=led.map(l=>l.gap).filter(v=>v!=null&&v>0&&v<120);if(g.length<3)return null;return{n:g.length,p50:pct(g,.5),p95:pct(g,.95),max:Math.max(...g),mean:g.reduce((a,b)=>a+b,0)/g.length}}
/* 3. histogram of ledger gaps */
function histogram(vals,edges){const h=edges.slice(0,-1).map((e,i)=>({from:e,to:edges[i+1],n:0}));h.push({from:edges[edges.length-1],to:Infinity,n:0});for(const v of vals){if(v==null)continue;let k=h.length-1;for(let i=0;i<h.length-1;i++)if(v>=h[i].from&&v<h[i].to){k=i;break}h[k].n++}return h}
/* 4. slow ledgers: closed much later than the usual pace */
function slow(led,factor=2){const st=closeStats(led);if(!st)return[];const lim=Math.max(st.p50*factor,st.p50+2);return led.filter(l=>l.gap!=null&&l.gap>lim).map(l=>({seq:l.seq,gap:l.gap,at:l.at})).slice(-20).reverse()}
/* 5. transaction mix */
function typeMix(txl){const m={};for(const t of txl){const k=t.type||'?',o=m[k]||(m[k]={type:k,n:0,fail:0,fees:0});o.n++;if(t.ok&&t.ok!=='tesSUCCESS')o.fail++;o.fees+=t.fee||0}return Object.values(m).sort((a,b)=>b.n-a.n).map(o=>({...o,failPct:o.n?Math.round(100*o.fail/o.n):0}))}

function biggest(txl,cur='LUMA',n=10){return txl.filter(t=>t.type==='Payment'&&t.cur===cur&&t.v>0&&(!t.ok||t.ok==='tesSUCCESS')).sort((a,b)=>b.v-a.v).slice(0,n)}
/* 7. busiest accounts */
function topAccounts(txl,n=8){const m={};for(const t of txl){if(t.from)(m[t.from]=m[t.from]||{a:t.from,sent:0,recv:0}).sent++;if(t.to)(m[t.to]=m[t.to]||{a:t.to,sent:0,recv:0}).recv++}return Object.values(m).map(o=>({...o,total:o.sent+o.recv})).sort((a,b)=>b.total-a.total).slice(0,n)}
/* 8. what did the person paste? */
function classify(q){q=String(q||'').trim();if(!q)return{kind:'empty'};if(/^[0-9A-Fa-f]{64}$/.test(q))return{kind:'hash',v:q.toUpperCase()};if(/^\d{1,10}$/.test(q))return{kind:'ledger',v:+q};if(/^(r[1-9A-HJ-NP-Za-km-z]{24,34}|[LT][1-9A-HJ-NP-Za-km-z]{33})$/.test(q))return{kind:'account',v:q};if(/^[A-Za-z0-9]{3}$/.test(q)||/^[0-9A-Fa-f]{40}$/.test(q))return{kind:'currency',v:q};return{kind:'text',v:q}}
/* 10. node health score 0-100 */
function healthScore(hs){const h=hs.slice(-30);if(h.length<3)return{score:null,parts:[],label:'collecting'};const parts=[];const up=h.filter(x=>!x.down).length/h.length;parts.push(['Reachable',Math.round(up*40),40]);const ok=h.filter(x=>!x.down&&x.age!=null);const fresh=ok.length?ok.filter(x=>x.age<=10).length/ok.length:0;parts.push(['Ledgers fresh',Math.round(fresh*30),30]);const peers=ok.length?ok[ok.length-1].peers:0;parts.push(['Peers',peers>=3?15:peers>=1?8:0,15]);const rtt=pct(ok.map(x=>x.rtt),.5);parts.push(['Response',rtt==null?0:rtt<300?10:rtt<1000?5:0,10]);const ld=ok.length?ok[ok.length-1].load||1:1;parts.push(['Load',ld<=1.5?5:ld<=8?2:0,5]);const score=parts.reduce((a,p)=>a+p[1],0);return{score,parts,label:score>=90?'Excellent':score>=70?'Good':score>=45?'Degraded':'Poor'}}

 sec('How long ledgers take to close',g.length>=3?hist(XM.histogram(g,[0,2,3,4,5,8])):'<div class="sub">collecting…</div>','c6')+
 sec('Slow ledgers',sl.length?`<div class="list">${sl.map(x=>`<div onclick="showLedger(${x.seq})"><span class="chip w">#${x.seq}</span><span style="flex:1">${x.gap.toFixed(1)} s to close</span><span class="m">${new Date(x.at).toLocaleTimeString()}</span></div>`).join('')}</div>`:'<div class="sub">None. Every ledger closed at the usual pace.</div>','c6')+
 sec('Compare two ledgers','<div class="row" style="gap:.4rem;flex-wrap:wrap"><input id="xl1" placeholder="ledger A" inputmode="numeric" style="width:7rem" data-xf="1"><input id="xl2" placeholder="ledger B" inputmode="numeric" style="width:7rem" data-xf="1"><button class="pill" onclick="X.cmpL()">Compare</button></div><div id="xlo" class="sub" style="margin-top:.5rem"></div>','c12'))});
X_.cmpL=async()=>{const o=$('#xlo'),a=+($('#xl1')||{}).value,b=+($('#xl2')||{}).value;if(!a||!b){o.textContent='Enter two ledger numbers.';return}o.textContent='loading…';try{const g=async n=>{const r=await ask({command:'ledger',ledger_index:n,transactions:false});const L=r.ledger||{};return{seq:+L.ledger_index||n,txs:+(L.transaction_hash&&L.txn_count!=null?L.txn_count:(L.transactions||[]).length)||0,closeTime:L.close_time?L.close_time+946684800:null,fees:L.total_coins!=null?Number(L.total_coins):null}};const A=await g(a),B=await g(b),d=XM.ledgerDelta(A,B);o.innerHTML=`Between #${a} and #${b}: ${d.dseq} ledgers, ${d.dtime!=null?d.dtime+' seconds apart':'time unknown'}. ${d.dfee!=null?'Coins burned as fees: '+(-d.dfee/1e6).toLocaleString()+' LUMA.':''}`}catch(e){o.textContent='Could not read those ledgers: '+e.message}};
/* Activity: type mix, biggest, busiest */
wrap(2,h=>{const mix=XM.typeMix(X_.txl),big=XM.biggest(X_.txl),top=XM.topAccounts(X_.txl);return h+grid(
 sec('Transaction types (this session)',mix.length?`<div class="list">${mix.slice(0,10).map(m=>`<div><span class="chip v">${esc(m.type)}</span><span style="flex:1">${m.n}</span><span class="m">${m.failPct}% failed</span></div>`).join('')}</div>`:'<div class="sub">waiting for transactions…</div>','c4')+
 sec('Biggest payments',big.length?`<div class="list">${big.map(t=>`<div onclick="showTx('${t.hash}')"><span class="a">${esc(short(t.from))} → ${esc(short(t.to))}</span><span class="m">${num(t.v)} LUMA</span></div>`).join('')}</div><button class="pill" style="margin-top:.4rem" onclick="X.bigCsv()">Export CSV</button>`:'<div class="sub">no LUMA payments yet</div>','c4')+
 sec('Busiest accounts',top.length?`<div class="list">${top.map(t=>`<div onclick="lookup('${t.a}')"><span class="a">${esc(short(t.a))}</span><span class="m">${t.sent} sent · ${t.recv} received</span></div>`).join('')}</div>`:'<div class="sub">waiting for transactions…</div>','c4'))});
X_.bigCsv=()=>csv('biggest-payments.csv',[['time','from','to','amount','hash']].concat(XM.biggest(X_.txl,'LUMA',50).map(t=>[new Date(t.at).toISOString(),t.from,t.to,t.v,t.hash])));
/* Search: smart jump, compare accounts, reserve and activity heatmap */
wrap(4,h=>h+`<div class="t c12" style="margin-top:.8rem" id="xmtools"><div class="k">Smart jump</div><div class="row" style="gap:.4rem;flex-wrap:wrap"><input id="xsj" placeholder="paste anything: address, transaction hash, ledger number, currency" style="flex:1;min-width:14rem" data-xf="1"><button class="pill" onclick="X.jump()">Go</button></div><div id="xsjo" class="sub" style="margin-top:.4rem"></div>
 <div class="k" style="margin-top:.9rem">Compare two accounts</div><div class="row" style="gap:.4rem;flex-wrap:wrap"><input id="xca" placeholder="account A" style="flex:1;min-width:10rem" data-xf="1"><input id="xcb" placeholder="account B" style="flex:1;min-width:10rem" data-xf="1"><button class="pill" onclick="X.cmpA()">Compare</button></div><div id="xcmp" style="margin-top:.5rem"></div>
 <div class="k" style="margin-top:.9rem">When is an account active?</div><div class="row" style="gap:.4rem;flex-wrap:wrap"><input id="xha" placeholder="account" style="flex:1;min-width:10rem" data-xf="1"><button class="pill" onclick="X.heat()">Show</button></div><div id="xheat" style="margin-top:.5rem"></div></div>`);
X_.jump=()=>{const c=XM.classify(($('#xsj')||{}).value),o=$('#xsjo');if(c.kind==='empty'){o.textContent='Paste something first.';return}if(c.kind==='ledger'){o.textContent='Opening ledger '+c.v;showLedger(c.v);return}if(c.kind==='hash'){o.textContent='Opening transaction';showTx(c.v);return}if(c.kind==='account'){o.textContent='Opening account';lookup(c.v);return}if(c.kind==='currency'){o.textContent='Looking for that token in the Tokens page…';go(7);return}o.textContent='That does not look like an address, hash, ledger number or currency.'};
const acctRow=async a=>{try{a=LumaAddr.toR(a)}catch{}const r=await ask({command:'account_info',account:a,ledger_index:'validated'}),d=r.account_data,v=(S.info||{}).validated_ledger||{};return{a,...XM.reserve(+d.Balance,d.OwnerCount||0,+v.reserve_base_xrp||10,+v.reserve_inc_xrp||2),seq:d.Sequence}};
X_.cmpA=async()=>{const o=$('#xcmp');o.innerHTML='<div class="sub">loading…</div>';try{const [A,B]=await Promise.all([acctRow($('#xca').value.trim()),acctRow($('#xcb').value.trim())]);const row=(k,f)=>`<div class="kv"><span>${k}</span><b>${f(A)}</b><b>${f(B)}</b></div>`;o.innerHTML=`<div class="kv"><span></span><b>${esc(short(A.a))}</b><b>${esc(short(B.a))}</b></div>`+row('Balance',x=>num(x.balance)+' LUMA')+row('Locked reserve',x=>num(x.reserve))+row('Spendable',x=>num(x.spendable))+row('Owned objects',x=>x.owners)+row('Transactions sent',x=>x.seq-1)}catch(e){o.innerHTML='<div class="al warn">Could not read one of the accounts: '+esc(e.message)+'</div>'}};
X_.heat=async()=>{const o=$('#xheat');o.innerHTML='<div class="sub">loading…</div>';try{let a=$('#xha').value.trim();try{a=LumaAddr.toR(a)}catch{}const r=await ask({command:'account_tx',account:a,limit:400,ledger_index_min:-1,ledger_index_max:-1}),T=(r.transactions||[]).map(x=>{const t=x.tx_json||x.tx||{};return t.date?(t.date+946684800)*1000:0}).filter(Boolean);if(!T.length){o.innerHTML='<div class="sub">No dated transactions found.</div>';return}const g=XM.heatmap(T),mx=Math.max(1,...g.flat());o.innerHTML=`<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:.6rem"><tr><td></td>${Array.from({length:24},(_,i)=>`<td style="padding:1px 2px;text-align:center">${i%3===0?i:''}</td>`).join('')}</tr>${g.map((row,d)=>`<tr><td style="padding-right:4px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]}</td>${row.map((n,hh)=>`<td title="${n} on ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]} ${hh}:00 UTC" style="width:12px;height:12px;background:rgba(0,255,140,${n?(0.15+0.85*n/mx).toFixed(2):0.04})"></td>`).join('')}</tr>`).join('')}</table></div><div class="sub">Based on its last ${T.length} transactions, in UTC.</div>`}catch(e){o.innerHTML='<div class="al warn">'+esc(e.message)+'</div>'}};
/* Health: score and SLO */
wrap(5,h=>{const hs=XM.healthScore(X_.hs),sl=XM.slo(X_.hs);return h+grid(
 tile('c4','Health score',hs.score==null?'…':`${hs.score}<span class="sub"> / 100</span>`,hs.label)+
 tile('c4','Fresh-ledger time',sl?sl.pct+'%':'…',sl?`of ${sl.n} checks had a ledger under 10 s old`:'collecting')+
 sec('What makes up the score',hs.parts.length?`<div class="list">${hs.parts.map(p=>`<div><span style="flex:1">${p[0]}</span><span class="m">${p[1]} / ${p[2]}</span></div>`).join('')}</div>`:'<div class="sub">collecting…</div>','c4'))});
/* Tokens: issuer inspector */
wrap(7,h=>h+`<div class="t c12" style="margin-top:.8rem"><div class="k">Issuer inspector</div><div class="row" style="gap:.4rem;flex-wrap:wrap"><input id="xii" placeholder="issuer address" style="flex:1;min-width:14rem" data-xf="1"><button class="pill" onclick="X.issuer()">Inspect</button></div><div id="xio" style="margin-top:.5rem"></div></div>`);
X_.issuer=async()=>{const o=$('#xio');o.innerHTML='<div class="sub">loading…</div>';try{let a=$('#xii').value.trim();try{a=LumaAddr.toR(a)}catch{}const r=await ask({command:'account_info',account:a,ledger_index:'validated'}),k=XM.issuerRisk(r.account_data);const ob=await ask({command:'gateway_balances',account:a,ledger_index:'validated'}).catch(()=>null);const obl=ob&&ob.obligations?Object.entries(ob.obligations):[];o.innerHTML=(k.length?k.map(x=>`<div class="al ${x[0]==='bad'?'crit':x[0]==='warn'?'warn':''}">${esc(x[1])}</div>`).join(''):'<div class="sub">No unusual settings.</div>')+(obl.length?`<div class="list" style="margin-top:.4rem">${obl.map(([c,v])=>`<div><span class="chip v">${esc(tname(c))}</span><span class="m">${num(+v)} issued</span></div>`).join('')}</div>`:'')}catch(e){o.innerHTML='<div class="al warn">Could not read that account: '+esc(e.message)+'</div>'}};
})()}
</script></body></html>
